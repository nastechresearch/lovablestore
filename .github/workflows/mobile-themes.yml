name: Mobile and theme tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-themes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-themes:
    name: Playwright mobile and theme suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${{ vars.STORE_URL || 'https://nastechresearch.github.io/lovablestore/' }}
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require database secret
        run: |
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::DATABASE_URL must start with postgres:// or postgresql:// (no quotes)."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npm run start -- -p 3100 > /tmp/lovable-store-server.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Store did not become ready on port 3100."
          cat /tmp/lovable-store-server.log
          exit 1

      - name: Run mobile and theme tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/lovable-store-server.log || true
