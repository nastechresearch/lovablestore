name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "public/icons/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename artefact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk lovable-store-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lovable-store-debug-apk
          path: lovable-store-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling APK release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Lovable Store Android (latest debug)
          body: |
            Automatic debug build of the Lovable Store Android shell.
            Download `lovable-store-debug.apk`, allow installs from your file
            manager and open it on Android 6 or newer. This build is unsigned
            for Play Store release and talks to the live Vercel storefront.
          files: lovable-store-debug.apk
          prerelease: true
          make_latest: "false"
